<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie - UI/UX Project</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="app">
    <header>
      <div>
        <small>Good Morning 👋</small>
        <h2>Divyanshi</h2>
      </div>
      <div class="profile">D</div>
    </header>

    <div class="search">
      🔍 <input type="text" placeholder="Search food or restaurants">
    </div>

    <section class="banner">
      <div>
        <h2>Hungry?</h2>
        <p>Get 30% OFF on your first order</p>
        <button>Order Now</button>
      </div>
      <span>🍕</span>
    </section>

    <h3>Categories</h3>

    <div class="categories">
      <div class="category active">🍕<span>Pizza</span></div>
      <div class="category">🍔<span>Burger</span></div>
      <div class="category">🍜<span>Noodles</span></div>
      <div class="category">🍰<span>Dessert</span></div>
    </div>

    <h3>Popular Near You</h3>

    <div class="food-card">
      <div class="food-img.pdf">🍕</div>
      <div class="food-info">
        <h3>Cheese Pizza</h3>
        <p>⭐ 4.8 · 25 min</p>
        <strong>₹249</strong>
      </div>
      <button class="add">+</button>
    </div>

    <div class="food-card">
      <div class="food.img">🍔</div>
      <div class="food-info">
        <h3>Classic Burger</h3>
        <p>⭐ 4.6 · 20 min</p>
        <strong>₹199</strong>
      </div>
      <button class="add">+</button>
    </div>

    <nav>
      <span class="selected">⌂<small>Home</small></span>
      <span>♡<small>Favorites</small></span>
      <span>🛒<small>Cart</small></span>
      <span>👤<small>Profile</small></span>
    </nav>
  </div>

</body>
</html>
